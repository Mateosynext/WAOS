name: waos-release-validation

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  validate-release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies for smoke and metadata
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser deps
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run critical real browser e2e gate
        working-directory: frontend
        run: npm run test:critical
      - name: Build and validate release artifact
        run: bash scripts/validate_release_in_ci.sh
      - name: Upload release audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waos-release-artifacts
          path: |
            dist/*.zip
            dist/*.json
            dist/*.sha256
            dist/reports/*.json
            frontend/playwright-report
            frontend/test-results
