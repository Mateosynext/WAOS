name: Deploy Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  deploy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      OPENAI_API_KEY: ci-placeholder
      OPENAI_MODEL: gemini-2.0-flash
      OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      OPENAI_TIMEOUT_SECONDS: "30"
      AUTOPILOT_MAX_AUTOFIX_ROUNDS: "2"
      PUBLIC_APP_URL: https://app.example.com
      API_BASE_URL: https://api.example.com
      API_INTERNAL_URL: https://api.example.com
      NEXT_PUBLIC_APP_URL: https://app.example.com
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      CORS_ALLOWED_ORIGINS: https://app.example.com
      ALLOWED_HOSTS: api.example.com,app.example.com
      DATABASE_URL: postgresql://waos:waos@example.com:5432/waos
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      SECRET_ENCRYPTION_KEY: ci-encryption-ci-encryption-ci-encryption-1234
      SECURE_COOKIES: "true"
      RUN_BOOTSTRAP_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deploy guard
        run: |
          python backend/scripts/deploy_guard.py
          python scripts/release_gate.py --profile source
      - name: Backend hardening unit tests
        run: PYTHONPATH=. python -m unittest backend.tests.test_deploy_hardening_guardrails -v
      - name: Frontend build gate
        working-directory: frontend
        run: |
          node ./scripts/validate-env.mjs
          node ./scripts/clean-stale-botstudio.mjs
          npm ci
          npm run typecheck
          npm run build
