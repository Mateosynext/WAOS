name: waos-frontend-quality

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Run smoke and node tests
        working-directory: frontend
        run: npm run smoke && npm run test:node
      - name: Install Playwright browser deps
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run mocked browser regression suite
        working-directory: frontend
        run: npm run test:mocked-ui
      - name: Run real browser e2e suite against live backend
        working-directory: frontend
        run: npm run test:e2e:real
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waos-playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
