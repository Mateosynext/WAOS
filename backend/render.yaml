services:
  - type: web
    name: waos-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/bootstrap.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: waos-postgres
          property: connectionString
      - key: APP_ENV
        value: production
      - key: RUN_BOOTSTRAP_SEED
        value: false
      - key: AUTO_RUN_MIGRATIONS
        value: true
      - key: APP_VERSION
        value: 0.17.5
      - key: DEFAULT_TIMEZONE
        value: America/Mexico_City
      - key: LOG_LEVEL
        value: INFO
      - key: SECURE_COOKIES
        value: true
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: APP_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gemini-3-flash-preview
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: META_VERIFY_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MAX_PAGE_SIZE
        value: 100
      - key: RUNTIME_CACHE_TTL_SECONDS
        value: 10
      - key: WEB_CONCURRENCY
        value: 2
      - key: DB_POOL_TIMEOUT_SECONDS
        value: 15
      - key: DB_POOL_MAX_SIZE
        value: 20
      - key: DB_POOL_MIN_SIZE
        value: 4
      - key: META_GRAPH_API_BASE
        value: https://graph.facebook.com/v23.0
    buildFilter:
      paths:
        - backend/**

  - type: worker
    name: waos-worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/worker_bootstrap.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: waos-postgres
          property: connectionString
      - key: APP_ENV
        value: production
      - key: AUTO_RUN_MIGRATIONS
        value: true
      - key: RUN_BOOTSTRAP_SEED
        value: false
      - key: APP_VERSION
        value: 0.17.5
      - key: DEFAULT_TIMEZONE
        value: America/Mexico_City
      - key: LOG_LEVEL
        value: INFO
      - key: APP_SECRET
        fromService:
          name: waos-api
          type: web
          envVarKey: APP_SECRET
      - key: SECRET_ENCRYPTION_KEY
        fromService:
          name: waos-api
          type: web
          envVarKey: SECRET_ENCRYPTION_KEY
      - key: OPENAI_API_KEY
        fromService:
          name: waos-api
          type: web
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_MODEL
        fromService:
          name: waos-api
          type: web
          envVarKey: OPENAI_MODEL
      - key: OPENAI_BASE_URL
        fromService:
          name: waos-api
          type: web
          envVarKey: OPENAI_BASE_URL
      - key: META_GRAPH_API_BASE
        fromService:
          name: waos-api
          type: web
          envVarKey: META_GRAPH_API_BASE
      - key: WORKER_MODE
        value: loop
      - key: WORKER_POLL_SECONDS
        value: 5
      - key: WORKER_BATCH_SIZE
        value: 50
    buildFilter:
      paths:
        - backend/**

databases:
  - name: waos-postgres
    databaseName: waos
    user: waos
    plan: basic-256mb
